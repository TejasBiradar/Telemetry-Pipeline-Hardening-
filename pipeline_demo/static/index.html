<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeline run</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f1;
      --card: #fbfcfc;
      --text: #14201c;
      --muted: #5a6b65;
      --line: #c5d0cc;
      --accent: #0f766e;
      --ok: #047857;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0; }
    .card {
      margin-top: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
    }
    label { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin-bottom: 8px; }
    select, button { font: inherit; }
    select {
      width: 100%;
      max-width: 420px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
    }
    .field { margin-bottom: 14px; }
    button {
      margin-top: 8px;
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #detail { margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); }
    .ok { color: var(--ok); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Pipeline run</h1>
    <p>Choose a reference pipeline and fault, then start the client job. This screen shows whether the job finished. Detection stays in Driftline.</p>
    <section class="card">
      <div class="field">
        <label for="pipeline">Pipeline</label>
        <select id="pipeline"></select>
      </div>
      <div class="field">
        <label for="fault">Fault</label>
        <select id="fault"></select>
      </div>
      <p id="detail"></p>
      <div>
        <button id="trigger" type="button">Trigger pipeline run</button>
      </div>
      <p id="message" style="margin-top: 12px;" role="status"></p>
    </section>
    <section class="card">
      <h2 style="margin: 0; font-size: 1rem;">Run status</h2>
      <p id="layout" style="margin-top: 6px;"></p>
      <table>
        <thead>
          <tr><th>When</th><th>Pipeline</th><th>Fault</th><th>Status</th><th>Files</th></tr>
        </thead>
        <tbody id="runs"></tbody>
      </table>
    </section>
  </main>
  <script>
    const trigger = document.getElementById("trigger")
    const pipeline = document.getElementById("pipeline")
    const fault = document.getElementById("fault")
    const detail = document.getElementById("detail")
    const message = document.getElementById("message")
    const runs = document.getElementById("runs")
    const layout = document.getElementById("layout")
    let catalogue = []
    let pipelines = []

    function selectedFault() {
      return catalogue.find((item) => item.id === fault.value) || null
    }

    function selectedPipeline() {
      return pipelines.find((item) => item.id === pipeline.value) || null
    }

    function paintDetail() {
      const item = selectedFault()
      detail.textContent = item ? item.detail : ""
    }

    function paint(data) {
      const selected = selectedPipeline()
      const prefix = selected ? selected.prefix : (data.prefix || "")
      layout.textContent = prefix
        ? "Files land in s3://" + data.bucket + "/" + prefix + "/{stage}/"
        : "Files land in s3://" + data.bucket + "/demo/<pipeline>/outputs/{stage}/"
      runs.replaceChildren()
      const rows = data.runs || []
      for (const row of rows) {
        const tr = document.createElement("tr")
        const when = document.createElement("td")
        when.textContent = row.finished_at || "—"
        const whichPipeline = document.createElement("td")
        whichPipeline.textContent = row.pipeline_label || row.pipeline || "—"
        const which = document.createElement("td")
        which.textContent = row.fault_label || row.fault || "—"
        const status = document.createElement("td")
        status.textContent = row.status
        status.className = row.status === "succeeded" ? "ok" : "bad"
        const files = document.createElement("td")
        files.className = "mono"
        files.textContent = (row.stages || []).join("\n") || row.error || ""
        tr.append(when, whichPipeline, which, status, files)
        runs.append(tr)
      }
      if (rows.length === 0) {
        const tr = document.createElement("tr")
        const td = document.createElement("td")
        td.colSpan = 5
        td.textContent = "No runs yet."
        tr.append(td)
        runs.append(tr)
      }
    }

    async function refresh() {
      const response = await fetch("/runs")
      paint(await response.json())
    }

    async function loadPipelines() {
      const response = await fetch("/pipelines")
      const data = await response.json()
      pipelines = data.pipelines || []
      pipeline.replaceChildren()
      for (const item of pipelines) {
        const option = document.createElement("option")
        option.value = item.id
        option.textContent = item.label
        pipeline.append(option)
      }
    }

    async function loadFaults() {
      const response = await fetch("/faults?pipeline=" + encodeURIComponent(pipeline.value))
      const data = await response.json()
      catalogue = data.faults || []
      fault.replaceChildren()
      for (const item of catalogue) {
        const option = document.createElement("option")
        option.value = item.id
        option.textContent = item.label
        fault.append(option)
      }
      paintDetail()
      await refresh()
    }

    fault.addEventListener("change", paintDetail)
    pipeline.addEventListener("change", () => {
      loadFaults().catch((err) => {
        message.textContent = String(err)
      })
    })

    trigger.addEventListener("click", async () => {
      trigger.disabled = true
      message.textContent = "Running…"
      try {
        const response = await fetch("/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pipeline: pipeline.value, fault: fault.value }),
        })
        if (!response.ok) {
          message.textContent = await response.text()
        } else {
          const body = await response.json()
          message.textContent = body.status === "succeeded" ? "Run finished." : "Run failed."
        }
      } catch (err) {
        message.textContent = String(err)
      } finally {
        trigger.disabled = false
        await refresh()
      }
    })

    loadPipelines().then(loadFaults).then(refresh)
    setInterval(refresh, 5000)
  </script>
</body>
</html>
