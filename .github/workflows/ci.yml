name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy teleguard api
      - name: Tests with coverage
        run: pytest --cov=teleguard --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Static security scan
        run: bandit -r teleguard api -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - name: Fault-injection evaluation gate
        run: python -m teleguard.evaluate.gate pipelines/web_analytics --out eval_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: eval_report/

  # Still pending: a blast-radius check that fails if the legacy pipeline diff leaves the
  # declared allowed paths (CLAUDE.md rule 1 / ARCHITECTURE.md §6) — depends on
  # pipelines/web_analytics/HOOKS.md, which A has not written yet.
