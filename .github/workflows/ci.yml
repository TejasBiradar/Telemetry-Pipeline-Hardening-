name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy teleguard
      - name: Tests with coverage
        run: pytest --cov=teleguard --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Static security scan
        run: bandit -r teleguard -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  # Added later (Member C): an eval-gate job that runs the fault-injection evaluation on a
  # fixed dataset and fails when precision/recall/lag or output equivalence regress, or
  # when the legacy pipeline diff leaves the declared blast radius.
