# Four containers:
#   postgres   — stage tables for the shipment ledger trigger
#   minio      — stage files from pipeline runs
#   pipeline   — trigger button and run success/failure
#   detection  — Driftline API, agent, and platform UI
#
#   docker compose up --build
#
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teleguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teleguard}
      # Default DB holds Shipment Ledger stage tables. Init also creates `driftline`
      # for registry / decisions / agent results (see db/init/).
      POSTGRES_DB: ${POSTGRES_DB:-teleguard}
    ports:
      # Host 5433 avoids clashing with other local Postgres on 5432.
      # Containers still reach this DB at postgres:5432 on the compose network.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: pipeline_demo/Dockerfile
    ports:
      - "3000:3000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: demo
      MINIO_SECURE: "false"
      PIPELINE_SRC_ROOT: /app/pipeline_src
      STAGE_DATABASE_URL: postgresql://${POSTGRES_USER:-teleguard}:${POSTGRES_PASSWORD:-teleguard}@postgres:5432/${POSTGRES_DB:-teleguard}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  detection:
    build:
      context: .
      dockerfile: Dockerfile.detection
    ports:
      - "8082:80"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Client stage outputs (Shipment Ledger tables) stay in `teleguard`.
      STAGE_DATABASE_URL: postgresql://${POSTGRES_USER:-teleguard}:${POSTGRES_PASSWORD:-teleguard}@postgres:5432/${POSTGRES_DB:-teleguard}
      # Driftline registry, MinIO/output config, decisions, runs, alerts.
      DRIFTLINE_DATABASE_URL: postgresql://${POSTGRES_USER:-teleguard}:${POSTGRES_PASSWORD:-teleguard}@postgres:5432/driftline
    volumes:
      - onboard_data:/app/data
      - ./pipelines:/app/pipelines:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

volumes:
  postgres_data:
  minio_data:
  onboard_data:
