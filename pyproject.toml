[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teleguard"
version = "0.1.0"
description = "Telemetry pipeline hardening: quality gates, drift detection, lineage tracing"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.2",
    "networkx>=3.2",
    "sqlglot>=30",
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
include = ["teleguard", "datagen"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["visit_*"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=teleguard --cov=datagen --cov-report=term-missing"
